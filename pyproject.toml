[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "author-income-tracker"
version = "0.1.0"
description = "Local-first CLI for authors to log royalties, advances, and expenses across books and platforms."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Dylan Asdale", email = "dylanasdale@users.noreply.github.com" },
]
license = { text = "MIT" }
keywords = ["author", "royalties", "kdp", "bookkeeping", "cli", "local-first"]

[project.scripts]
author-income-tracker = "author_income_tracker.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["author_income_tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
